# One-time v1.0.0 screenshot refresh; remove after assets are committed.
name: Capture v1 screenshots

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - "scripts/capture-screenshots.py"
      - "src/index.template.html"

permissions:
  contents: write
  actions: read

concurrency:
  group: capture-v1-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/v1.0.0-finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install capture-only browser tools
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Download validated v1.0.0 standalone artifact
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow build-standalone.yml --branch "$GITHUB_HEAD_REF" --json databaseId,headSha,conclusion --limit 30 | python -c 'import os,sys,json; runs=json.load(sys.stdin); match=[r for r in runs if r["headSha"]==os.environ["HEAD_SHA"] and r["conclusion"]=="success"]; print(match[0]["databaseId"] if match else "")')
          test -n "$run_id" || { echo "No successful matching standalone build yet"; exit 1; }
          mkdir -p "$RUNNER_TEMP/release-html"
          gh run download "$run_id" --name "standalone-html-$HEAD_SHA" --dir "$RUNNER_TEMP/release-html"
          test -f "$RUNNER_TEMP/release-html/dist/index.html"
          grep -q 'id="versionBadge">v1.0.0' "$RUNNER_TEMP/release-html/dist/index.html"

      - name: Capture desktop and mobile screenshots in both languages
        run: |
          python scripts/capture-screenshots.py --url "file://$RUNNER_TEMP/release-html/dist/index.html"

      - name: Commit screenshots to release PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshot.png assets/screenshot-en.png assets/screenshot-mobile.png assets/screenshot-mobile-en.png
          if git diff --cached --quiet; then
            echo "Screenshots already up to date"
            exit 0
          fi
          git commit -m "docs: capture actual v1.0.0 screenshots in Japanese and English"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
