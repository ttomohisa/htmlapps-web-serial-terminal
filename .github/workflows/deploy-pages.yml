name: Deploy standalone app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      pages-ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Run release regression tests
        shell: pwsh
        run: node --test tests/reconnect-regression.mjs tests/rc-hardening.mjs tests/release-assets.mjs tests/mobile-build-info.test.cjs tests/serial-terminal-regression.test.cjs tests/v1-1-log-view.test.cjs

      - name: Verify desktop/mobile browser UI and serial operations
        shell: pwsh
        run: |
          $toolsPath = Join-Path $env:RUNNER_TEMP "serial-release-browser-tests"
          npm install --prefix $toolsPath --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed." }
          $env:NODE_PATH = Join-Path $toolsPath "node_modules"
          & (Join-Path $toolsPath "node_modules/.bin/playwright.cmd") install chromium
          if ($LASTEXITCODE -ne 0) { throw "Chromium setup failed." }
          node scripts/mobile-help.browser.cjs
          if ($LASTEXITCODE -ne 0) { throw "Mobile and bilingual browser verification failed." }
          node scripts/serial-features.browser.cjs
          if ($LASTEXITCODE -ne 0) { throw "Serial browser verification failed." }

      - name: Check whether GitHub Pages is enabled
        id: pages-status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/pages" --silent 2>$null

          if ($LASTEXITCODE -eq 0) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "GitHub Pages is enabled. The deployment will continue."
            exit 0
          }

          "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          @"
          ## GitHub Pages is not enabled yet

          The standalone HTML was built successfully, but deployment was skipped.

          1. Open **Settings → Pages** in this repository.
          2. Under **Build and deployment**, set **Source** to **GitHub Actions**.
          3. Open **Actions**, select this workflow, and choose **Re-run all jobs**.

          This one-time repository setting cannot be enabled with the default `GITHUB_TOKEN`.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          Write-Warning "GitHub Pages is not enabled. Deployment is skipped; see the workflow summary for setup steps."
          exit 0

      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.pages-status.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.sha }}
          path: |
            *.html
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: needs.build.outputs.pages-ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    # A verified push to main is required. Manual runs do not publish tags.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check version and existing release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./app.config.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::app.config.json must declare a stable Semantic Version."
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent >/dev/null 2>release-check-error.txt; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; no new tag or release needed."
          elif grep -q 'HTTP 404' release-check-error.txt; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat release-check-error.txt >&2
            exit 1
          fi

      - name: Download verified standalone files
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: standalone-html-${{ github.sha }}
          path: release-input

      - name: Create version tag and GitHub Release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-assets
          cp release-input/dist/index.html release-assets/web-serial-terminal.html
          cp release-input/dist/index.self-extract.html release-assets/web-serial-terminal-self-extract.html
          gh release create "$RELEASE_TAG" release-assets/*.html \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
